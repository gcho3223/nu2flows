_target_: lightning.Trainer

min_epochs: 1
max_epochs: 1
enable_progress_bar: True
accelerator: cpu  # CPU 강제 사용, auto로 하면 GPU 사용
devices: 1
precision: 32
check_val_every_n_epoch: 1
gradient_clip_val: 1
num_sanity_val_steps: 0  # validation 활성화 (빠른 sanity check)
log_every_n_steps: 10  # 10스텝마다 로그 출력 (기본값: 50)

# Interpolated
default_root_dir: ${paths.output_dir}
